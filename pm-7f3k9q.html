<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pixel Mailbox</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1b1b1f; color: #eee; max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 16px; }
  fieldset { border: 1px solid #444; border-radius: 10px; margin-bottom: 14px; }
  label { display: block; margin: 6px 0; font-size: 14px; }
  input[type=text], select, input[type=number] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #555; background: #2a2a30; color: #eee; box-sizing: border-box; }
  canvas { background: #000; image-rendering: pixelated; width: 100%; max-width: 480px; aspect-ratio: 1; touch-action: none; border-radius: 8px; display: block; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
  button { padding: 10px 14px; border-radius: 8px; border: 0; background: #3a3a44; color: #eee; font-size: 15px; }
  button.primary { background: #f0c040; color: #111; font-weight: 600; }
  #status { margin-top: 10px; min-height: 1.2em; }
  input[type=color] { width: 44px; height: 38px; border: 0; background: none; }
</style>
</head>
<body>
<h1>Pixel Mailbox</h1>

<fieldset>
  <legend>Setup (saved on this device)</legend>
  <label>Firebase database URL <input type="text" id="db" placeholder="https://your-project-default-rtdb.firebaseio.com"></label>
  <label>Secret word (same as in the firmware) <input type="text" id="secret"></label>
  <label>Screen names, comma separated <input type="text" id="names" value="erin,him"></label>
</fieldset>

<fieldset>
  <legend>Art</legend>
  <label>Grid size (art pixels per side)
    <input type="number" id="grid" value="50" min="8" max="120">
  </label>
  <div class="row">
    <input type="color" id="color" value="#cdeee0">
    <button id="penBtn">Pen</button>
    <button id="eraseBtn">Eraser</button>
    <button id="clearBtn">Clear</button>
    <label style="margin:0"><input type="file" id="file" accept="image/*" hidden><button onclick="document.getElementById('file').click()">Upload PNG</button></label>
  </div>
  <canvas id="cv" width="50" height="50"></canvas>
  <p style="font-size:13px;color:#aaa">Black means "see-through" in the cube. For a PNG, set the grid size to how many art-pixels wide your drawing is (e.g. 150-px canvas drawn with 3-px blocks → 50).</p>
</fieldset>

<div class="row">
  <select id="to" style="flex:1"></select>
  <button class="primary" id="sendBtn">Send ♥</button>
</div>
<div id="status"></div>

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let N = 50, erasing = false, drawing = false;

function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
['db', 'secret', 'names'].forEach(k => {
  const v = load('pm_' + k); if (v) $(k).value = v;
  $(k).addEventListener('change', () => { store('pm_' + k, $(k).value.trim()); fillNames(); });
});
function fillNames() {
  const names = $('names').value.split(',').map(s => s.trim()).filter(Boolean);
  $('to').innerHTML = names.map(n => `<option value="${n}">to ${n}</option>`).join('');
}
fillNames();

function resetCanvas(n) {
  N = n; cv.width = n; cv.height = n;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, n, n);
}
resetCanvas(50);
$('grid').addEventListener('change', () => resetCanvas(Math.max(8, Math.min(120, +$('grid').value || 50))));
$('clearBtn').onclick = () => resetCanvas(N);
$('penBtn').onclick = () => erasing = false;
$('eraseBtn').onclick = () => erasing = true;

function paint(e) {
  const r = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * N);
  const y = Math.floor((e.clientY - r.top) / r.height * N);
  ctx.fillStyle = erasing ? '#000' : $('color').value;
  ctx.fillRect(x, y, 1, 1);
}
cv.addEventListener('pointerdown', e => { drawing = true; paint(e); });
cv.addEventListener('pointermove', e => { if (drawing) paint(e); });
window.addEventListener('pointerup', () => drawing = false);

$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    // sample the centre of each art-pixel block (nearest neighbour, keeps edges crisp)
    const tmp = document.createElement('canvas');
    tmp.width = img.width; tmp.height = img.height;
    const t = tmp.getContext('2d'); t.drawImage(img, 0, 0);
    const src = t.getImageData(0, 0, img.width, img.height).data;
    resetCanvas(N);
    const out = ctx.getImageData(0, 0, N, N);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const sx = Math.floor((x + 0.5) * img.width / N), sy = Math.floor((y + 0.5) * img.height / N);
      const si = (sy * img.width + sx) * 4, di = (y * N + x) * 4;
      const a = src[si + 3] / 255;   // transparent → black
      out.data[di] = src[si] * a; out.data[di + 1] = src[si + 1] * a; out.data[di + 2] = src[si + 2] * a; out.data[di + 3] = 255;
    }
    ctx.putImageData(out, 0, 0);
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
  e.target.value = '';
});

function toRGB565Base64() {
  const d = ctx.getImageData(0, 0, N, N).data;
  const bytes = new Uint8Array(N * N * 2);
  for (let i = 0, j = 0; i < d.length; i += 4, j += 2) {
    const c = ((d[i] & 0xF8) << 8) | ((d[i + 1] & 0xFC) << 3) | (d[i + 2] >> 3);
    bytes[j] = c >> 8; bytes[j + 1] = c & 0xFF;
  }
  let s = ''; bytes.forEach(b => s += String.fromCharCode(b));
  return btoa(s);
}

$('sendBtn').onclick = async () => {
  const db = $('db').value.trim().replace(/\/$/, ''), secret = $('secret').value.trim(), to = $('to').value;
  if (!db || !secret) { $('status').textContent = 'Fill in the setup box first.'; return; }
  $('status').textContent = 'Sending…';
  try {
    const res = await fetch(`${db}/${encodeURIComponent(secret)}/frames/${encodeURIComponent(to)}.json`, {
      method: 'PUT',
      body: JSON.stringify({ id: String(Date.now()), w: N, h: N, px: toRGB565Base64() })
    });
    $('status').textContent = res.ok ? `Sent to ${to}! It'll show up within a few minutes.` : `Error ${res.status}`;
  } catch (err) { $('status').textContent = 'Could not send: ' + err.message; }
};
</script>
</body>
</html>
