<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resume – Erin Payne</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'EB Garamond', serif;
      background-color: #fefefe;
      color: #222;
      line-height: 1.6;
      min-height: 100vh;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 60px;
      border-bottom: 1px solid #ddd;
      max-width: 1200px;
      margin: 0 auto;
    }

    nav .name {
      font-size: 3rem;
      font-weight: 500;
      margin-left: -40px;
    }

    nav .links a {
      margin-left: 30px;
      text-decoration: none;
      font-size: 1.3rem;
      font-weight: 500;
      color: #222;
      position: relative;
      transition: color 0.4s;
    }

    nav .links a:hover { color: #666; }

    nav .links a::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -3px;
      width: 0;
      height: 2px;
      background-color: #666;
      transition: width 0.4s ease;
      transform: translateX(-50%);
    }

    nav .links a:hover::after { width: 100%; }

    .container {
      max-width: 1200px;
      margin: 70px auto;
      padding: 0 20px;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 500;
    }

    .download {
      font-size: 1.2rem;
      font-weight: 500;
      color: #222;
      text-decoration: none;
      border: 1px solid #222;
      padding: 6px 18px;
      transition: background-color 0.4s, color 0.4s;
    }

    .download:hover {
      background-color: #222;
      color: #fefefe;
    }

    .resume-frame {
      width: 100%;
      height: 1100px;
      border: 1px solid #ddd;
    }

    footer {
      margin-top: 80px;
      padding: 12px 0;
      text-align: center;
      font-size: 0.8rem;
      color: #666;
      border-top: 1px solid #ddd;
    }

    @media (max-width: 900px) {
      nav .name {
        margin-left: 0;
        text-align: center;
      }

      .header-row {
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }

      .resume-frame {
        height: 80vh;
      }
    }
  </style>
</head>

<body>

  <nav>
    <div class="name">Erin Payne</div>
    <div class="links">
      <a href="index.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="experience.html">Experience</a>
      <a href="resume.html">Resume</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="container">
    <div class="header-row">
      <h1>Resume</h1>
      <a class="download" href="resume.pdf" target="_blank">Open PDF</a>
    </div>

    <iframe class="resume-frame" src="resume.pdf" title="Erin Payne Resume"></iframe>
  </div>

  <footer>
    © 2026 Erin Payne
  </footer>

</body>
</html>
